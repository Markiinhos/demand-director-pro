openapi: 3.1.0
info:
  title: Gestor Operacional - Actions
  description: Operações financeiras e operacionais para agências multicanal via GPT.
  version: "1.0.0"
servers:
  - url: https://[YOUR_SUPABASE_PROJECT].supabase.co/functions/v1/chatgpt-actions
    description: Production Edge Function
paths:
  /getDailyPriorities:
    post:
      operationId: getDailyPriorities
      summary: Retorna prioridades pendentes, divididas em hoje e atrasadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /getWeeklyPriorities:
    post:
      operationId: getWeeklyPriorities
      summary: Retorna prioridades dos próximos 7 dias.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /listOverdueDemands:
    post:
      operationId: listOverdueDemands
      summary: Lista apenas demandas atrasadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /listUpcomingDemands:
    post:
      operationId: listUpcomingDemands
      summary: Lista demandas próximas de vencer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  description: Quantos dias considerar para o vencimento.
      responses:
        "200":
          description: OK
  /searchClients:
    post:
      operationId: searchClients
      summary: Procura um client_id pelo nome do cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
      responses:
        "200":
          description: OK
  /getClientContext:
    post:
      operationId: getClientContext
      summary: Retorna todo o contexto financeiro e de demandas de um cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
              required:
                - client_id
      responses:
        "200":
          description: OK
  /listOverduePayments:
    post:
      operationId: listOverduePayments
      summary: Lista pagamentos vencidos que não foram recebidos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /listDueCollections:
    post:
      operationId: listDueCollections
      summary: Lista cobranças a vencer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /listExpiringContracts:
    post:
      operationId: listExpiringContracts
      summary: Lista contratos expirando (na mesa, não assinados).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /listUpcomingMeetings:
    post:
      operationId: listUpcomingMeetings
      summary: Lista reuniões agendadas para os próximos dias.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /getAgencyMetrics:
    post:
      operationId: getAgencyMetrics
      summary: Retorna métricas gerais de recebimento, clientes e demandas em andamento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /listPendingActions:
    post:
      operationId: listPendingActions
      summary: Lista as ações geradas em canais (whatsapp ou via actions) pendentes de aprovação pelo admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /createDemand:
    post:
      operationId: createDemand
      summary: Cria uma nova demanda para um cliente. Requer aprovação (status inicial de approval_pending).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                title:
                  type: string
                due_date:
                  type: string
                description:
                  type: string
              required:
                - client_id
                - title
                - due_date
      responses:
        "200":
          description: OK
  /rescheduleDemand:
    post:
      operationId: rescheduleDemand
      summary: Altera a data de uma demanda (Approval pending).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                demand_id:
                  type: string
                due_date:
                  type: string
              required:
                - demand_id
                - due_date
      responses:
        "200":
          description: OK
  /prepareCollection:
    post:
      operationId: prepareCollection
      summary: Prepara uma cobrança nova (Approval pending).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                amount:
                  type: number
                description:
                  type: string
                due_date:
                  type: string
              required:
                - client_id
                - amount
                - description
      responses:
        "200":
          description: OK
  /prepareContract:
    post:
      operationId: prepareContract
      summary: Prepara um contrato novo para o cliente (Approval pending).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                title:
                  type: string
              required:
                - client_id
                - title
      responses:
        "200":
          description: OK
  /createMeetingAgenda:
    post:
      operationId: createMeetingAgenda
      summary: Agenda reunião (Approval pending).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                client_id:
                  type: string
                scheduled_at:
                  type: string
              required:
                - title
                - scheduled_at
      responses:
        "200":
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: CustomToken
security:
  - bearerAuth: []
