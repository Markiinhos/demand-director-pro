openapi: 3.1.0
info:
  title: Gestor Operacional - Actions
  description: Operações financeiras e operacionais para agências multicanal via GPT.
  version: "1.0.0"
servers:
  - url: https://lwabrwtqwveqrkwegikg.supabase.co/functions/v1/chatgpt-actions
    description: Production Edge Function
paths:
  /getDailyPriorities:
    post:
      operationId: getDailyPriorities
      summary: Retorna prioridades pendentes, divididas em hoje e atrasadas.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /getWeeklyPriorities:
    post:
      operationId: getWeeklyPriorities
      summary: Retorna prioridades dos próximos 7 dias.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /listOverdueDemands:
    post:
      operationId: listOverdueDemands
      summary: Lista apenas demandas atrasadas.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /listUpcomingDemands:
    post:
      operationId: listUpcomingDemands
      summary: Lista demandas próximas de vencer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  description: Quantos dias considerar para o vencimento.
              required:
                - days
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /searchClients:
    post:
      operationId: searchClients
      summary: Procura um client_id pelo nome do cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: Nome do cliente para buscar.
              required:
                - query
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /getClientContext:
    post:
      operationId: getClientContext
      summary: Retorna todo o contexto financeiro e de demandas de um cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  format: uuid
                  description: UUID do cliente.
              required:
                - client_id
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /listOverduePayments:
    post:
      operationId: listOverduePayments
      summary: Lista pagamentos vencidos que não foram recebidos.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /listDueCollections:
    post:
      operationId: listDueCollections
      summary: Lista cobranças a vencer.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /listExpiringContracts:
    post:
      operationId: listExpiringContracts
      summary: Lista contratos expirando (na mesa, não assinados).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /listUpcomingMeetings:
    post:
      operationId: listUpcomingMeetings
      summary: Lista reuniões agendadas para os próximos dias.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /getAgencyMetrics:
    post:
      operationId: getAgencyMetrics
      summary: Retorna métricas gerais de recebimento, clientes e demandas em andamento.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /listPendingActions:
    post:
      operationId: listPendingActions
      summary: Lista as ações geradas em canais (whatsapp ou via actions) pendentes de aprovação pelo admin.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /createDemand:
    post:
      operationId: createDemand
      summary: Cria uma nova demanda para um cliente. Requer aprovação (status inicial de approval_pending).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  format: uuid
                  description: UUID do cliente.
                title:
                  type: string
                  description: Título da demanda.
                due_date:
                  type: string
                  format: date
                  description: Data de vencimento no formato YYYY-MM-DD.
                description:
                  type: string
                  description: Detalhes da demanda.
              required:
                - client_id
                - title
                - due_date
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /rescheduleDemand:
    post:
      operationId: rescheduleDemand
      summary: Altera a data de uma demanda (Approval pending).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                demand_id:
                  type: string
                  format: uuid
                  description: UUID da demanda.
                due_date:
                  type: string
                  format: date
                  description: Nova data de vencimento (YYYY-MM-DD).
              required:
                - demand_id
                - due_date
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /prepareCollection:
    post:
      operationId: prepareCollection
      summary: Prepara uma cobrança nova (Approval pending).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  format: uuid
                  description: UUID do cliente.
                amount:
                  type: number
                  description: Valor da cobrança.
                description:
                  type: string
                  description: Descrição da cobrança.
                due_date:
                  type: string
                  format: date
                  description: Data de vencimento da cobrança (YYYY-MM-DD).
              required:
                - client_id
                - amount
                - description
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /prepareContract:
    post:
      operationId: prepareContract
      summary: Prepara um contrato novo para o cliente (Approval pending).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  format: uuid
                  description: UUID do cliente.
                title:
                  type: string
                  description: Título do contrato.
              required:
                - client_id
                - title
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /createMeetingAgenda:
    post:
      operationId: createMeetingAgenda
      summary: Agenda reunião (Approval pending).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Título ou assunto da reunião.
                client_id:
                  type: string
                  format: uuid
                  description: UUID do cliente participante.
                scheduled_at:
                  type: string
                  format: date-time
                  description: Data e hora da reunião.
              required:
                - title
                - scheduled_at
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

components:
  schemas: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: CustomToken
security:
  - bearerAuth: []
